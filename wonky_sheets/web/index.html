<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="An offline-first spreadsheet with formulas, charts and pivot tables, built for working together. Part of Wonky Work, the open-source office suite built with Flutter and Serverpod.">

  <!--
    Link previews (Open Graph, X cards; specs/01 §2.4). Every URL of the app,
    a shared document's too, serves this file: keep it generic, never per
    item. No og:url, so a preview names the link that was shared. The image
    URL is absolute and versioned (/web/ is cached as immutable): give a new
    image a new name.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Wonky Work">
  <meta property="og:title" content="Wonky Sheets">
  <meta property="og:description" content="An offline-first spreadsheet with formulas, charts and pivot tables, built for working together. Part of Wonky Work, the open-source office suite built with Flutter and Serverpod.">
  <meta property="og:image" content="https://wonky.work/web/images/og-1.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Wonky Work: Write, Sheets, Slides and Drive, built by the community with Flutter and Serverpod.">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Wonky Sheets">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>Wonky Sheets</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
