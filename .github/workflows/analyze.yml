name: Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  # Keep in step with format.yml, tests.yml and deploy.yml. The workspace lock
  # file needs Flutter >= 3.47.0 (pubspec.lock `sdks:`).
  FLUTTER_VERSION: '3.47.5'

jobs:
  # Every workspace member (root pubspec.yaml `workspace:`) plus tool/.
  # Generated code is excluded by each package's analysis_options.yaml.
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.FLUTTER_VERSION}}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          members=$(awk '/^workspace:/{f=1;next} /^[^ -]/{f=0} f && /^ *- /{sub(/^ *- */,""); sub(/ *#.*/,""); print}' pubspec.yaml)
          dart analyze --fatal-infos $members tool

  # Package dependency rules (specs/01-architecture.md §2.1).
  dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.FLUTTER_VERSION}}
          cache: true

      # Writes .dart_tool/package_graph.json, which the check reads to find
      # external packages that depend on Flutter.
      - name: Install dependencies
        run: flutter pub get

      - name: Check package dependency rules
        run: dart run tool/check_dependencies.dart

  # Committed generated code is up to date (CQ-64b): Serverpod, gen-l10n and
  # the pseudo-locales, the spec index, the RevLog schemas and the Sheets
  # script API index are regenerated and must match the checkout.
  generated:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.1.0-beta.3'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.FLUTTER_VERSION}}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli@$VERSION
          echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"

      - name: Check generated files
        run: bash tool/check_generated.sh
