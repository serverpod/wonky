name: wonky_code
description: "Wonky Work shared code highlighting (pure Dart): languages, token classes, syntax palettes, the TextMate engine (copied from syntax_highlight) and the highlight.js fallback tokenizer."
publish_to: none

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  collection: ^1.19.1
  highlight: ^0.7.0
  wonky_core:
    path: ../wonky_core

dev_dependencies:
  wonky_lints:
    path: ../wonky_lints
  test: ^1.25.5
