name: wonky_revlog_flutter
description: "RevLog client of Wonky Work (Flutter): local cache, transport, per-file sync connection with bootstrap pages, per-user client (RevLog spec 06)."
publish_to: none

environment:
  sdk: '^3.12.2'
  flutter: '^3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.3
  sqlite_async: ^0.14.5
  uuid: ^4.6.0
  web: ^1.1.1
  wonky_app:
    path: ../wonky_app
  wonky_client:
    path: ../../wonky_client
  wonky_revlog:
    path: ../wonky_revlog
  wonky_ui:
    path: ../wonky_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  wonky_lints:
    path: ../wonky_lints
  sqlite3: ^3.7.0
