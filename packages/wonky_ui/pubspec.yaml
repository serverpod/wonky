name: wonky_ui
description: "Wonky Work design system: theme, tokens and custom shad-style widgets."
publish_to: none

environment:
  sdk: '^3.12.2'
  flutter: '^3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  flutter_test:
    sdk: flutter
  intl: ^0.20.3
  shad: ^1.0.2

dev_dependencies:
  wonky_lints:
    path: ../wonky_lints
flutter:
  generate: true
  # The UI and default document typefaces (WonkyFonts). shad bundled them
  # until 1.0; these are the same variable fonts, under their OFL licenses.
  fonts:
    - family: Inter
      fonts:
        - asset: "fonts/Inter[opsz,wght].ttf"
    - family: Geist
      fonts:
        - asset: "fonts/Geist[wght].ttf"
    - family: GeistMono
      fonts:
        - asset: "fonts/GeistMono[wght].ttf"
  assets:
    - fonts/OFL-Inter.txt
    - fonts/OFL-Geist.txt
