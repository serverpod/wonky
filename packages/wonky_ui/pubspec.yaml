name: wonky_ui
description: "Wonky Work design system: theme, tokens and custom shad-style widgets."
publish_to: none

environment:
  sdk: '^3.12.2'
  flutter: '^3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  flutter_test:
    sdk: flutter
  intl: ^0.20.3
  shad: ^0.99.4

dev_dependencies:
  wonky_lints:
    path: ../wonky_lints
flutter:
  generate: true
