name: wonky_code_flutter
description: "Wonky Work shared code rendering (Flutter): CodeView and CodeTextStyler on top of wonky_code."
publish_to: none

environment:
  sdk: '^3.12.2'
  flutter: '^3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  wonky_code:
    path: ../wonky_code
  # In-place code editing (CodeEditorField, Slides 07 §3.5).
  re_editor: ^0.10.0

dev_dependencies:
  wonky_lints:
    path: ../wonky_lints
  flutter_test:
    sdk: flutter
