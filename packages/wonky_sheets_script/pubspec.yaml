  analyzer: ^8.2.0
  native_synchronization: ^0.3.1
  uuid: ^4.5.1
  wonky_core:
    path: ../wonky_core
  wonky_sheets_core:
    path: ../wonky_sheets_core
  wonky_sync_models:
    path: ../wonky_sync_models

dev_dependencies:
  wonky_lints:
    path: ../wonky_lints
  test: ^1.25.5
