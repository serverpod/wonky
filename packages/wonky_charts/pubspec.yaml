name: wonky_charts
description: "Pure-Dart chart engine of Wonky Work: spec model, ChartData, layout, scene, 3D, SVG/PDF/PNG renderers, statistics."
publish_to: none

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  # gzip of large snapshot columns (`gz:`, Slides 08 §3.3); already resolved through `image`.
  archive: ^4.5.1
  collection: ^1.19.1
  image: ^4.5.4
  pdf: ^3.13.1
  wonky_numfmt:
    path: ../wonky_numfmt

dev_dependencies:
  wonky_lints:
    path: ../wonky_lints
  test: ^1.25.5
  xml: ^7.0.1
