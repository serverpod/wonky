name: wonky_sheets_core
description: "Pure Dart core for Wonky Sheets: addressing, formula engine, number formats, workbook model, import/export."
publish_to: none

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  wonky_revlog:
    path: ../wonky_revlog
  archive: ^4.5.1
  clock: ^1.1.3
  collection: ^1.19.1
  # BMP images of XLSX imports become PNGs.
  image: ^4.12.0
  intl: ^0.20.3
  pdf: ^3.13.1
  petitparser: ^7.1.0
  timezone: ^0.11.1
  vector_math: ^2.1.4
  wonky_charts:
    path: ../wonky_charts
  wonky_numfmt:
    path: ../wonky_numfmt
  wonky_sync_models:
    path: ../wonky_sync_models
  xml: ^7.0.1

dev_dependencies:
  wonky_lints:
    path: ../wonky_lints
  test: ^1.25.5
  # Golden compatibility vectors (test/formula/golden/**.yaml, 05 §22.4).
  yaml: ^3.1.4
