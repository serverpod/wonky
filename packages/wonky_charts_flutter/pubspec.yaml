name: wonky_charts_flutter
description: "Flutter rendering of the Wonky Work chart engine: scene painter, text measurer, 3D GPU backend (flutter_scene), orbit gesture, chart glyphs and type icons, ChartView, data table dialog, ChartStyleEditor."
publish_to: none

environment:
  sdk: '^3.12.2'
  flutter: '^3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # GPU backend of 3D charts (Sheets 08 §23.7): Flutter GPU on native
  # platforms, WebGL2 on the web. Meshes are built at runtime.
  flutter_scene: ^0.24.3
  # The shared chart widgets (ChartView tooltips, data table dialog, chart
  # type icons, ChartStyleEditor) are built with shad (02).
  shad: ^1.0.2
  # Color picker of the ChartStyleEditor.
  wonky_ui:
    path: ../wonky_ui
  vector_math: ^2.1.4
  wonky_charts:
    path: ../wonky_charts

dev_dependencies:
  flutter_test:
    sdk: flutter
  wonky_lints:
    path: ../wonky_lints
