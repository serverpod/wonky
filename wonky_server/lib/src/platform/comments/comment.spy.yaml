class: Comment
table: comment
fields:
  threadId: int, relation(parent=comment_thread, onDelete=Cascade)
  ### Client-supplied id for idempotent replies (optional).
  uuid: UuidValue?
  ### Null for system comments.
  authorId: int?
  authorKind: ActorKind
  ### Markdown (inline subset).
  body: String
  ### UserProfile ids mentioned in [body].
  mentions: List<int>
  ### JSON {emoji: [userId]}.
  reactions: String, default='{}'
  createdAt: DateTime
  editedAt: DateTime?
  ### Soft delete: shown as "Comment deleted".
  deletedAt: DateTime?
  systemEvent: CommentSystemEvent?
  ### (M14) A publication's message (authorKind system), specs/18 §5.2.
  publicationId: int?, relation(parent=publication, onDelete=SetNull)
indexes:
  comment_thread_idx:
    fields: threadId, createdAt
  comment_uuid_idx:
    fields: uuid
    unique: true
  ### Comments by time (usage analytics, specs/19 §3).
  comment_created_idx:
    fields: createdAt
