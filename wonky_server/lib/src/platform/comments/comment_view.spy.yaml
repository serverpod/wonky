class: CommentView
fields:
  id: int
  uuid: UuidValue?
  threadUuid: UuidValue
  author: UserSummary?
  authorKind: ActorKind
  ### Empty when deleted.
  body: String
  mentions: List<UserSummary>
  ### emoji → user ids.
  reactions: Map<String, List<int>>
  createdAt: DateTime
  editedAt: DateTime?
  deleted: bool
  systemEvent: CommentSystemEvent?
  ### (M14) Name shown instead of a user: the publication of a message
  ### (specs/18 §5.2).
  authorLabel: String?
