### The caller's board status (specs/16 §9.1).
class: BoardMe
fields:
  signedIn: bool
  userId: int?
  isAdmin: bool
  blocked: bool
  blockedReason: String?
  activeClaims: List<int>
  githubLogin: String?
  ### Board AI available (Jev configured): shown in the dialog notice.
  aiChecks: bool
  repository: String
  securityContact: String
  claimHours: int
  ### Claims the caller may hold at a time (`maxActiveClaimsPerUser`).
  maxActiveClaims: int, default=3
  ### Set while the caller may not claim tasks (specs/16 §8.4).
  claimBlockedUntil: DateTime?
  claimBlockedReason: String?
