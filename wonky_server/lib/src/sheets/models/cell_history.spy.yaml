### Cell value history kept after ChangeLog pruning (Sheets 10 §6), latest
### 100 per cell.
class: CellHistory
table: cell_history
serverOnly: true
fields:
  fileUuid: UuidValue
  sheetId: UuidValue
  rowId: UuidValue
  colId: UuidValue
  ### The op that wrote the value.
  revision: int
  userUuid: UuidValue
  actorKind: ActorKind
  label: String
  at: DateTime
  before: String?
  after: String?
indexes:
  cell_history_cell_idx:
    fields: fileUuid, sheetId, rowId, colId, at
  cell_history_change_idx:
    fields: fileUuid, revision, rowId, colId
    unique: true
