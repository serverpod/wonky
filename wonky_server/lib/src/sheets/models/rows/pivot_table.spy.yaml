### A pivot table; its output is computed locally, never stored as cells.
class: PivotTable
table: pivot_table
serverOnly: true
fields:
  id: UuidValue, defaultModel=random_v7
  ### The RevLog file (set by the sequencer; RevLog spec 02 §2.1).
  file: RevFile?, relation(onDelete=Cascade)
  ### The revision that last wrote the row.
  revision: int, default=0
  ### Sheet that displays the pivot.
  sheet: Sheet?, relation(onDelete=Cascade, deferred)
  anchorRowId: UuidValue
  anchorColId: UuidValue
  sourceRangeJson: String
  ### PivotSpec v1 (Sheets 07 §7.1).
  specJson: String
  createdAt: DateTime, defaultModel=now
indexes:
  pivot_table_file_idx:
    fields: fileId, id
