### A named range, named formula or named function.
class: NamedRange
table: named_range
serverOnly: true
fields:
  id: UuidValue, defaultModel=random_v7
  ### The RevLog file (set by the sequencer; RevLog spec 02 §2.1).
  file: RevFile?, relation(onDelete=Cascade)
  ### The revision that last wrote the row.
  revision: int, default=0
  spreadsheet: Spreadsheet?, relation(onDelete=Cascade, deferred)
  ### Case-insensitive unique (client-enforced).
  name: String
  ### GridRange, or null when formula is used.
  rangeJson: String?
  ### Named formula / LAMBDA in stored-reference form.
  formula: String?
  comment: String?
  ### {kind, description, params, examples} (Sheets 05 §24 F3).
  metaJson: String?
  createdAt: DateTime, defaultModel=now
indexes:
  named_range_file_idx:
    fields: fileId, id
