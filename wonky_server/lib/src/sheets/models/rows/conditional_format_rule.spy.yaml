### A conditional formatting rule (Sheets 06 §15).
class: ConditionalFormatRule
table: conditional_format_rule
serverOnly: true
fields:
  id: UuidValue, defaultModel=random_v7
  ### The RevLog file (set by the sequencer; RevLog spec 02 §2.1).
  file: RevFile?, relation(onDelete=Cascade)
  ### The revision that last wrote the row.
  revision: int, default=0
  sheet: Sheet?, relation(onDelete=Cascade, deferred)
  ### Priority, first = highest.
  sortKey: String
  ### List of GridRange.
  rangesJson: String
  ruleJson: String
  enabled: bool, default=true
  createdAt: DateTime, defaultModel=now
indexes:
  conditional_format_rule_file_idx:
    fields: fileId, id
