### A column entity with a stable id, ordered by sortKey.
class: SheetColumn
table: sheet_column
serverOnly: true
fields:
  id: UuidValue, defaultModel=random_v7
  ### The RevLog file (set by the sequencer; RevLog spec 02 §2.1).
  file: RevFile?, relation(onDelete=Cascade)
  ### The revision that last wrote the row.
  revision: int, default=0
  sheet: Sheet?, relation(onDelete=Cascade, deferred)
  sortKey: String
  width: double?
  hidden: bool, default=false
  ### Column default format.
  formatJson: String?
  createdAt: DateTime, defaultModel=now
indexes:
  sheet_column_file_idx:
    fields: fileId, id
  sheet_column_order_idx:
    fields: sheetId, sortKey
