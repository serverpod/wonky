# This is the configuration file for your local development environment. By
# default, it runs a single server on port 8080. To set up your server, you will
# need to add the name of the database you are connecting to and the user name.
# The password for the database is stored in the config/passwords.yaml.
#
# When running your server locally, the server ports are the same as the public
# facing ports.

# Configuration for the main API server.
apiServer:
  port: 8080
  publicHost: localhost
  publicPort: 8080
  publicScheme: http

# Configuration for the Insights server.
insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

# Configuration for the web server.
webServer:
  port: 8082
  publicHost: localhost
  publicPort: 8082
  publicScheme: http

# This is the database setup for your server.
database:
  host: localhost
  port: 8090
  name: wonky
  user: postgres
  #requireSsl: true # defaults to false
  #isUnixSocket: true # defaults to false
  dataPath: .serverpod/development/pgdata
  # Defaults to 10 (a negative or null value removes the limit). Raised for
  # development: hot reloads restart the server while long sync and
  # projection-rebuild transactions still hold connections (patch OS-9).
  maxConnectionCount: 20

# This is the setup for Redis.
redis:
  enabled: false
  host: localhost
  port: 8091
  #user: # defaults to empty
  #requireSsl: true # defaults to false

maxRequestSize: 524288 # The maximum size of requests allowed in bytes

sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
  consoleLogFormat: text # Defaults to "json", options are "text" or "json"

#futureCall:
#  enabled: true # Defaults to true, set to false to disable scheduling and running future calls
#  executionEnabled: true # Defaults to true
#  concurrencyLimit: 1 # Defaults to 1, a negative or null value removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000

# Keeps auth tokens in httpOnly cookies shared by all apps (/drive/, /write/,
# /sheets/, /slides/) and the `flutter run` dev origins (cookies are not
# port-isolated). Web clients
# opt in with `client.cookieAuth = true` (specs/01-architecture.md §2.5).
authCookie:
  secure: false # Cookies require https; relaxed for http://localhost
  path: /
  sameSite: lax
allowedOrigins:
  - http://localhost:8082 # The web server serving /drive/, /write/, /sheets/, /slides/
  - http://localhost:8100 # Wonky Drive dev app (`flutter run`)
  - http://localhost:8101 # Wonky Write dev app (`flutter run`)
  - http://localhost:8102 # Wonky Sheets dev app (`flutter run`)
  - http://localhost:8104 # Wonky Slides dev app (`flutter run`)

# Wonky Work settings (read by `lib/src/platform/config/wonky_config.dart`;
# specs/01-architecture.md §6). Unknown to Serverpod itself.
wonky:
  features:
    ai: true
    scripting: true
    mcpUiBridge: true
    experimentalCharts: true
  sheets:
    maxCellsPerSpreadsheet: 1000000
    scriptTimeoutMs: 30000
    scriptDailyQuotaMs: 5400000
    scriptServerTimeoutMs: 360000
    scriptAllowHttp: false
    scriptPoolSize: 4
  write:
    snapshotEveryNOps: 500
    maxDocumentChars: 2000000
  # M13 (RevLog): the CRDT sync protocol is gone, so 2.x clients cannot
  # sync (specs/01 §7, specs/17 RD-17); the apps default to WONKY_VERSION
  # 3.0.0. (v2 raised it to 2.0.0 for enum values v1 clients cannot read.)
  minClientVersion: 3.0.0
  # The /mcp endpoint (specs/09-mcp.md §1–2, read by
  # lib/src/platform/mcp/mcp_config.dart). Requests with an Origin header must
  # match allowedOrigins; the Host header must match allowedHosts.
  mcp:
    enabled: true
    allowedHosts: [localhost, 127.0.0.1]
    allowedOrigins:
      - http://localhost:8082
      - http://localhost:8100
      - http://localhost:8101
      - http://localhost:8102
      - http://localhost:8104
    rateLimitPerMinute: 600
    sessionIdleMinutes: 60
  # The AI features (specs/10-ai-assistant.md §1, read by
  # lib/src/platform/ai/ai_config.dart), through dartantic_ai. Server keys are
  # the `openaiApiKey`, `anthropicApiKey` and `geminiApiKey` entries in
  # config/passwords.yaml. `provider` picks one when several are set
  # (default: the first with a key, Anthropic → OpenAI → Gemini). Without any
  # server key users can add their own in Settings › AI providers
  # (`allowUserKeys`). `models` overrides the default model ids per provider.
  ai:
    enabled: true
    # provider: anthropic
    allowUserKeys: true
    # models:
    #   anthropic: {model: claude-opus-5-5, fastModel: claude-haiku-5-5}
    #   openai: {model: gpt-5, fastModel: gpt-5-mini}
    #   gemini: {model: gemini-3.1-pro-preview, fastModel: gemini-3.8-flash}
    dailyTokenBudget: 2000000
    maxConcurrentRequests: 2
    requestTimeoutMinutes: 10
    maxToolRounds: 30
