# This is the configuration file for your production environment.
# Typically, you will want to route the traffic through a load balancer
# which adds SSL security through https. If you use Serverpod's standard
# Terraform scripts to deploy your server, all you need to change in
# this file is the examplepod.com domain name.

# Configuration for the main API server.
apiServer:
  port: 8080
  publicHost: api.examplepod.com
  publicPort: 443
  publicScheme: https

# Configuration for the Insights server.
insightsServer:
  port: 8081
  publicHost: insights.examplepod.com
  publicPort: 443
  publicScheme: https

# Configuration for the web server.
webServer:
  port: 8082
  publicHost: app.examplepod.com
  publicPort: 443
  publicScheme: https

# This is the database setup for your servers. The default for the Google Cloud
# Engine Terraform configuration is to connect on a private IP address.
# If you are connecting on a public IP (e.g. on AWS or Google Cloud Run), you
# connect on the public IP of the database e.g. database.examplepod.com.
database:
  host: database.private-production.examplepod.com
  port: 5432
  name: serverpod
  user: postgres
  requireSsl: true
  #isUnixSocket: true # defaults to false
  #maxConnectionCount: 10 # Defaults to 10, a negative or null value removes the limit

# This is the setup for Redis. The default for the Google Cloud Engine Terraform
# configuration is to connect on a private IP address.
# If you are connecting on a public IP (e.g. on AWS or Google Cloud Run), you
# connect on the public IP of the database e.g. redis.examplepod.com.
# Disabled: one server instance. Running several instances behind a load
# balancer requires Redis (specs/13-security-and-operations.md §4): set
# `enabled: true` here or SERVERPOD_REDIS_ENABLED=true (plus host, port and the
# `redis` password) — only with a reachable Redis, as production does not fall
# back to local messages when Redis is down.
redis:
  enabled: false
  host: redis.private-production.examplepod.com
  port: 6379
  #user: # defaults to empty
  #requireSsl: true # defaults to false

maxRequestSize: 524288 # The maximum size of requests allowed in bytes

sessionLogs:
  consoleEnabled: false
# persistentEnabled: true
# consoleLogFormat: json # Defaults to "json", options are "text" or "json"

#futureCall:
#  enabled: true # Defaults to true, set to false to disable scheduling and running future calls
#  executionEnabled: true # Defaults to true
#  concurrencyLimit: 1 # Defaults to 1, a negative or null value removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000

# Keeps auth tokens in httpOnly, secure cookies shared by all apps
# (/drive/, /write/, /sheets/, /slides/; specs/01-architecture.md §2.5).
authCookie:
  secure: true
  path: /
  sameSite: lax
allowedOrigins:
  - https://app.examplepod.com # The web server serving all apps (/drive/, /write/, …)

# Wonky Work settings (read by `lib/src/platform/config/wonky_config.dart`;
# specs/01-architecture.md §6). Unknown to Serverpod itself.
wonky:
  features:
    ai: true
    scripting: false
    mcpUiBridge: true
    experimentalCharts: false
  sheets:
    maxCellsPerSpreadsheet: 1000000
    scriptTimeoutMs: 30000
    scriptDailyQuotaMs: 5400000
    scriptServerTimeoutMs: 360000
    scriptAllowHttp: false
    scriptPoolSize: 4
    scriptWorker: true
    scriptUserConcurrency: 10
  write:
    snapshotEveryNOps: 500
    maxDocumentChars: 2000000
  # M13 (RevLog): the CRDT sync protocol is gone, so 2.x clients cannot
  # sync (specs/01 §7, specs/17 RD-17); the apps default to WONKY_VERSION
  # 3.0.0. (v2 raised it to 2.0.0 for enum values v1 clients cannot read.)
  minClientVersion: 3.0.0
