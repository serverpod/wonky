# Copy to `passwords.yaml` (git-ignored) for local development:
#
#   cp config/passwords.example.yaml config/passwords.yaml
#
# The database and Redis passwords match docker-compose.yaml; they are not
# secrets (local development containers only, committed on purpose). Replace every
# CHANGE_ME with a random string, e.g. `openssl rand -base64 24`.

development:
  database: 'prDe3lU8Wyd11pAWlsVGDvMXbi70jBHV'
  redis: 'aQMm53sbLVf4Qv2dKWEZLor7FLDtPgpR'

  serviceSecret: 'CHANGE_ME'
  emailSecretHashPepper: 'CHANGE_ME'
  jwtHmacSha512PrivateKey: 'CHANGE_ME'
  jwtRefreshTokenHashPepper: 'CHANGE_ME'

  # Optional. In-app AI (specs/10): without a key, each user can add their
  # own in Settings › AI providers.
  # anthropicApiKey: ''
  # openaiApiKey: ''
  # geminiApiKey: ''

  # Optional. Bugs & improvements AI (specs/16 §6): Jev (typesafe.ai) for
  # moderation and labels, Gemini (paid tier) for summaries, task prompts and
  # PR reviews. Without them posts are published unchecked.
  # internalJevApiKey: ''
  # internalGeminiApiKey: ''

  # Optional. Google sign-in: the OAuth client JSON from Google Cloud.
  # googleClientSecret: ''

