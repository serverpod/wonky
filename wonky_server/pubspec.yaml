name: wonky_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  clock: ^1.1.3
  crypto: ^3.0.7
  dart_jsonwebtoken: ^3.4.1
  dart_quill_delta: ^9.6.0
  dartantic_ai: ^3.4.2
  http: ^1.6.0
  image: ^4.12.0
  mcp_dart: ^2.4.2
  mime: ^2.0.0
  serverpod: 4.1.0-beta.3
  serverpod_auth_idp_server: 4.1.0-beta.3
  serverpod_cloud_storage: 4.1.0-beta.3
  whiskers: ^0.1.1
  wonky_core:
    path: ../packages/wonky_core
  wonky_sheets_core:
    path: ../packages/wonky_sheets_core
  wonky_sheets_script:
    path: ../packages/wonky_sheets_script
  wonky_revlog:
    path: ../packages/wonky_revlog
  wonky_slides_core:
    path: ../packages/wonky_slides_core
  wonky_sync_models:
    path: ../packages/wonky_sync_models
  wonky_write_core:
    path: ../packages/wonky_write_core
  yaml: ^3.1.4

dev_dependencies:
  async: ^2.13.1
  wonky_lints:
    path: ../packages/wonky_lints
  meta: ^1.19.0
  pointycastle: ^4.0.0
  serverpod_test: 4.1.0-beta.3
  test: ^1.25.5
  wonky_mcp_stdio:
    path: ../packages/wonky_mcp_stdio

serverpod:
  scripts:
    # Build every Flutter web app into the server's web directory
    # (specs/01-architecture.md §2.4): wonky_<app> → web/<app> (/<app>/) for
    # drive, write, sheets and slides; app folders that don't exist yet are
    # skipped. Built with --wasm (cross-origin isolation for
    # OPFS/SharedArrayBuffer, specs/13 §3), one app after another (parallel
    # builds swap on a 16 GB machine), by tool/build_web.dart on both
    # platforms: it copies each build (flutter's --output flag doesn't work on
    # Windows, flutter/flutter#157886), drops the font families the app never
    # uses (tool/prune_web_fonts.dart, CQ-45), prints the bundle sizes and
    # exits non-zero when any build fails (CQ-64h). There is no automatic
    # `flutter clean` retry (it hid real errors); pass --clean-retry to the
    # script for one.
    flutter_build:
      windows: dart ..\tool\build_web.dart
      posix: dart ../tool/build_web.dart

  # The apps run from their flutter_driver entry point, on fixed ports so
  # their origins are stable for `allowedOrigins` and cookie auth
  # (specs/01-architecture.md §2.4–2.5). None is launched automatically by
  # `serverpod start` (each debug web app costs a lot of memory): start the
  # one you need from the `serverpod start` UI or with the `spawn_flutter_app`
  # MCP tool.
  flutter_apps:
    drive:
      path: ../wonky_drive
      displayName: "Wonky Drive"
      auto_launch: false
      target: lib/driver.dart
      web-port: 8100
    write:
      path: ../wonky_write
      displayName: "Wonky Write"
      auto_launch: false
      target: lib/driver.dart
      web-port: 8101
    sheets:
      path: ../wonky_sheets
      displayName: "Wonky Sheets"
      auto_launch: false
      target: lib/driver.dart
      web-port: 8102
    slides:
      path: ../wonky_slides
      displayName: "Wonky Slides"
      auto_launch: false
      target: lib/driver.dart
      web-port: 8104
