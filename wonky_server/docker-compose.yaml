# The database and Redis passwords below are NOT secrets: they protect local
# development and test containers only (bound to localhost ports) and are
# repeated in config/passwords.example.yaml, .vscode/tasks.json and the CI
# workflows. Production passwords are managed by Serverpod Cloud.
services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: wonky
      POSTGRES_PASSWORD: "prDe3lU8Wyd11pAWlsVGDvMXbi70jBHV"
    volumes:
      - wonky_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "aQMm53sbLVf4Qv2dKWEZLor7FLDtPgpR"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: wonky_test
      POSTGRES_PASSWORD: "8hI_nurnnhk2QTfnxCOHS_hqtFwFEvsG"
    volumes:
      - wonky_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "FQOvu3laYz0fOw_TmBW7VVIYlrUlEiLU"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  wonky_data:
  wonky_test_data:
