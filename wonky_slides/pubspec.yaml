name: wonky_slides
description: "Wonky Slides: presentations of Wonky Work — slides, themes, builds and presenting."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '^3.12.2'
  flutter: '^3.47.0'

resolution: workspace

# Allowed dependencies: specs/01-architecture.md §2.1 (`wonky_slides`),
# checked by tool/check_dependencies.dart. SL-1 is the skeleton; the
# Slides packages (wonky_slides_core, wonky_revlog*, …) join with the
# work packages that use them (Slides 12 §4).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  intl: ^0.20.3
  shad: ^0.99.4
  wonky_app:
    path: ../packages/wonky_app
  # 3D slide transitions on the GPU (features/transitions/gpu, SL-29;
  # Slides 06 §12.3): Flutter GPU / WebGL2 through flutter_scene (already in
  # the workspace via wonky_charts_flutter) and its 32-bit vector_math.
  flutter_scene: ^0.24.3
  vector_math: ^2.1.4
  # Chart elements (features/stage, SL-10; features/elements/chart, SL-32):
  # the engine types (snapshots, specs, morphs, 3D views) and the Flutter
  # painter, ChartView, data table dialog, type icons and ChartStyleEditor.
  wonky_charts:
    path: ../packages/wonky_charts
  wonky_charts_flutter:
    path: ../packages/wonky_charts_flutter
  wonky_client:
    path: ../wonky_client
  # Code elements (features/elements/code, SL-31): the in-place editor
  # (`CodeEditorField`, re_editor) and the shared tokenizer, languages and
  # palettes of `wonky_code` (re-exported).
  wonky_code_flutter:
    path: ../packages/wonky_code_flutter
  wonky_core:
    path: ../packages/wonky_core
  wonky_slides_core:
    path: ../packages/wonky_slides_core
  # Text editing overlay (features/text_editing; 03 §6.1, spike SL-4): the
  # vendored, patched super_editor (pubspec_overrides.yaml) and the shared
  # Delta types of the Slides text schema.
  super_editor: ^0.3.0-dev.52
  wonky_rich_text:
    path: ../packages/wonky_rich_text
  # RevLog sync (features/revlog; RevLog spec 08 §2): the shared core and
  # the client (cache, transport, per-file connection).
  wonky_revlog:
    path: ../packages/wonky_revlog
  wonky_revlog_flutter:
    path: ../packages/wonky_revlog_flutter
  clock: ^1.1.3
  file_picker: ^13.1.0
  wonky_sync_models:
    path: ../packages/wonky_sync_models
  wonky_ui:
    path: ../packages/wonky_ui
  # Bundled TTFs embedded in client PDFs (features/print, SL-20).
  wonky_fonts:
    path: ../packages/wonky_fonts
  # Browser APIs of the print preview (in-app PDF viewer, print dialog)
  # and of presenting (Fullscreen API, Slides 10 §1.3).
  web: ^1.1.1
  # QR code of the audience link (*Open on another device…*, Slides 10
  # §5.2); pure Dart, already in the workspace through `pdf`.
  qr: ^3.0.2
  # Images (features/elements/image, SL-15): SVGs are rasterized on insert
  # (03 §6.5.1) and uploaded images are downloaded from their signed URLs.
  flutter_svg: ^2.3.0
  http: ^1.6.0

dev_dependencies:
  flutter_driver:
    sdk: flutter
  wonky_lints:
    path: ../packages/wonky_lints
  flutter_test_robots: ^0.0.24
  flutter_test:
    sdk: flutter
  provider: ^6.1.5+1

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Development URLs of the four apps; the server's AppConfigRoute
    # replaces it at runtime (specs/01-architecture.md §2.4).
    - assets/config.json
