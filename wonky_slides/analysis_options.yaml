include: package:wonky_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - ios/**
    - web/**
    - macos/**

linter:
  rules:
    # TODO(CQ-64e): turn on (wonky_lints default); 27 discarded futures
    # (sync callbacks calling async code) need `unawaited(…)` or an await.
    discarded_futures: false
