name: _
publish_to: none

environment:
  sdk: '^3.12.2'

workspace:
  - wonky_client
  - wonky_server
  - wonky_write
  - wonky_sheets
  - wonky_drive
  - wonky_slides
  - packages/wonky_core
  - packages/wonky_ui
  - packages/wonky_app
  - packages/wonky_sync_models
  - packages/wonky_write_core
  - packages/wonky_sheets_core
  - packages/wonky_sheets_script
  - packages/wonky_mcp_stdio
  - packages/wonky_code
  - packages/wonky_code_flutter
  - packages/wonky_numfmt
  - packages/wonky_charts
  - packages/wonky_charts_flutter
  - packages/wonky_rich_text
  - packages/wonky_fonts
  - packages/wonky_spellcheck
  - packages/wonky_revlog
  - packages/wonky_revlog_flutter
  - packages/wonky_slides_core
  - packages/wonky_rich_editor
  - packages/wonky_lints
  # Vendored, patched copy (third_party/dart_eval/PATCHES.md); the server
  # compiles scripts with it, so it is a workspace member too.
  - third_party/dart_eval

# Overrides. Pub workspaces only honor overrides at the root.
#
# Only overrides the server needs belong here: Serverpod Cloud builds the
# server from this file (trimmed to the server's packages), and pub resolves
# every root override even when nothing depends on it, so a Flutter-only
# override pulls Flutter into the cloud build, and a path override to a folder
# that isn't uploaded breaks it.
#
# Flutter-only overrides (super_editor, attributed_text, flutter_secure_storage)
# live in `pubspec_overrides.yaml`, which pub reads locally but Serverpod Cloud
# does not upload. pubspec_overrides.yaml REPLACES this section locally, so
# keep the entries below in both files.
dependency_overrides:
  # sqlite3_web 0.9.5 made WorkerDatabase `base`, which breaks the web build of
  # sqlite_async 0.14.5. Keep web/db_worker.js in step with sqlite_async.
  sqlite3_web: 0.9.4
