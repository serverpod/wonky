name: wonky_drive
description: "Wonky Drive: every file of Wonky Work in one place — uploads, previews and storage."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '^3.12.2'
  flutter: '^3.47.0'

resolution: workspace

# Allowed dependencies: specs/01-architecture.md §2.1 (`wonky_drive`),
# checked by tool/check_dependencies.dart.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # File upload… picker (Drive 02 §3.1).
  file_picker: ^13.1.0
  go_router: ^18.0.2
  # File previews: signed-URL fetches (Drive 02 §6.1).
  http: ^1.6.0
  intl: ^0.20.3
  shad: ^0.99.4
  wonky_app:
    path: ../packages/wonky_app
  wonky_client:
    path: ../wonky_client
  wonky_code_flutter:
    path: ../packages/wonky_code_flutter
  wonky_core:
    path: ../packages/wonky_core
  wonky_ui:
    path: ../packages/wonky_ui

dev_dependencies:
  flutter_driver:
    sdk: flutter
  wonky_lints:
    path: ../packages/wonky_lints
  flutter_test:
    sdk: flutter
  # Shell screens in widget tests read ShellServices from a Provider.
  provider: ^6.1.5+1

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Development URLs of the four apps; the server's AppConfigRoute
    # replaces it at runtime (specs/01-architecture.md §2.4).
    - assets/config.json
